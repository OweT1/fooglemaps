services:
  postgres:
    image: postgres:16-alpine
    container_name: fooglemaps-db
    environment:
      POSTGRES_DB: fooglemaps
      POSTGRES_USER: fooglemaps
      POSTGRES_PASSWORD: fooglemaps_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
